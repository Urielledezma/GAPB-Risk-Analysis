# Model parameters.
#
# Every constant the analysis depends on lives here. Reports read these values;
# they never restate them. Changing a confidence level or an estimation window
# is a one-line edit that propagates to every table and chart on the next
# render.

# --- Sample windows ----------------------------------------------------------
sample:
  # Start of the estimation sample for volatility and VaR models.
  start: "2021-01-01"
  # Parameter cut-off for stages 03 and 05: nothing after this date informs a
  # parameter they fit. Stage 04 has its own, variance.estimation_end.
  end: "2025-12-31"
  # First session the stage 03 annex re-runs the class moving-average
  # procedure on, one session at a time.
  oos_start: "2026-01-01"
  # Years reported individually in the year-by-year volatility table. 2026 is
  # year-to-date: stage 03's section 2 runs "hasta lo que va de 2026".
  annual_breakdown: [2021, 2022, 2023, 2024, 2025, 2026]

# --- Conventions -------------------------------------------------------------
conventions:
  trading_days_per_year: 252
  # Daily model inputs use continuously compounded returns. Stage 02 converts
  # them to compounded simple returns for event windows and calendar years;
  # its descriptive cutoff is configured separately in price_history.yml.
  return_type: log
  price_field: adjusted

# --- Distribution tests ------------------------------------------------------
tests:
  alpha: 0.05

# --- Geometric Brownian motion (stage 03) ------------------------------------
gbm:
  # Start of the estimation window for the normality tests, the t-test and both
  # GBM projections. Part 3 asks for "todo el periodo de cotización hasta
  # diciembre 2025", so it takes the whole history up to sample.end; the loader
  # begins at the first session that exists. Stages 04 and 05 keep sample.start.
  estimation_start: "2006-01-01"
  # Horizons in trading days, using daily parameters.
  horizons_days: [10, 20, 40]
  # Horizons in months, using annualised parameters.
  horizons_months: [3, 6, 9, 12]
  confidence: 0.95
  # Draws per Monte Carlo check: the class convention.
  n_paths: 100000

# --- Variance models (stage 04) ----------------------------------------------
variance:
  # Part 4 windows. Every model is estimated on sample.start..estimation_end
  # ("desde el 2021 a septiembre 2026") and scored on the sessions from
  # evaluation_start to evaluation_end, which no parameter ever sees. Inside
  # the estimation window, the 70 / 30 cut of ma_class.train_share chooses m
  # and the GARCH orders, as in class.
  estimation_end: "2026-09-30"
  evaluation_start: "2026-10-05"
  evaluation_end: "2026-10-30"
  # The class procedure for choosing m (Modulo 3): candidate windows and the
  # share of the sample before the 70 / 30 cut. Stage 03 re-runs it on every
  # session from sample.oos_start on, over the history from
  # gbm.estimation_start, and its rolling-volatility figure uses the window it
  # chooses on the last session.
  ma_class:
    windows: [5, 10, 20, 40]
    train_share: 0.70
  ewma:
    # RiskMetrics convention, used as the benchmark against which an optimised
    # lambda has to justify itself.
    lambda_riskmetrics: 0.94
    # Grid on which stage 04 draws the log-likelihood profile of lambda.
    lambda_grid_min: 0.80
    lambda_grid_max: 0.995
    lambda_grid_by: 0.005
    # Search interval of the maximum-likelihood lambda (Verosimilitud.qmd).
    lambda_interval: [0.001, 0.9999]
  ddewma:
    # Search interval of the least-squares alpha (DDEWMA.Rmd).
    alpha_interval: [0.001, 0.9999]
  garch:
    # The class procedure (ARCH - GARCH.qmd): six sGARCH candidates as
    # (ARCH order, GARCH order), normal errors, the hybrid solver, and the
    # ARCH-LM test with 20 lags.
    candidates: [[1, 0], [2, 0], [1, 1], [1, 2], [2, 1], [2, 2]]
    distribution: norm
    solver: hybrid
    arch_lm_lags: 20
    # Starting sums of the ARCH and GARCH coefficients for the likelihood
    # search. On 2021-2026 GAPB the likelihood has two local maxima and the
    # default start alone can stop at the lower one; every search below is
    # run and the highest likelihood kept. Pairs must sum to less than one.
    start_alpha: [0.05, 0.15]
    start_beta: [0.60, 0.80]

# --- Value at Risk (stage 05) ------------------------------------------------
var:
  # Equally weighted position per asset, in MXN.
  position_mxn: 100000
  confidence: [0.95, 0.975, 0.99]
  horizons_days: [1, 5, 10, 20]
  # Trailing window used for the parametric covariance matrix.
  parametric_window_months: 6
  monte_carlo:
    n_simulations: 100000
    confidence: 0.99
  backtest:
    # Rolling window for the one-day backtest, in trading days.
    window: 250
    # Kupiec unconditional coverage test.
    alpha: 0.05
  optimisation:
    objective: minimise_var
    confidence: 0.99
    long_only: true
    max_weight: 0.40

# --- Reproducibility ---------------------------------------------------------
seed: 20260101
