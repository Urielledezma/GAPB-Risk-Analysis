# GAP filings on SEC EDGAR — the provenance manifest.
#
# Every fundamental figure in stage 01 comes from one of the documents listed
# here. The manifest is the single source of truth for *which* filing supplies
# *which* period; analysis/06_ingest_gap_filings.R only executes it.
#
# Keeping the mapping in configuration rather than in the script is what makes
# the sourcing auditable: a reader who doubts a quarter can open the accession
# named beside it and read the number off the page.
#
# GAP is a foreign private issuer, so there is no 10-Q and no quarterly XBRL.
# The annual figures come from the 20-F, the quarterly ones from the 6-K
# earnings releases, and the two are reconciled against each other on every run.

cik: "1347557"

# --------------------------------------------------------------------------
# Annual — one filing, three fiscal years, one accounting basis.
#
# The FY2025 20-F states 2023, 2024 and 2025 side by side, so the whole annual
# panel is internally consistent. Stitching three separate 20-Fs together would
# have mixed figures from before and after each restatement.
# --------------------------------------------------------------------------
annual:
  accession: "0001193125-26-161714"
  # EDGAR renders each statement of the filing as its own small table.
  balance_sheet: "R2.htm"
  income_statement: "R3.htm"
  years: [2025, 2024, 2023]
  label: "GAP Form 20-F 2025"
  url: "https://www.sec.gov/Archives/edgar/data/1347557/000119312526161714/pac-20251231.htm"

# --------------------------------------------------------------------------
# Quarterly — one release per quarter, 1Q19 through 4Q25.
#
# `column` selects which of the two periods a release prints:
#
#   current   the quarter the release reports. This is the default and the
#             preferred reading, because it carries the share count that was
#             actually outstanding at the time.
#   prior     the year-earlier comparative. Used once, for 1Q19: that release
#             (0000903423-19-000201) published its financial tables as scanned
#             images, so there is no machine-readable primary copy of it. The
#             1Q20 release restates 1Q19 against the same 561,000,000 shares,
#             so nothing is distorted by taking it from there.
#
# GAP restates comparatives against the current share count whenever it has
# repurchased stock, which is why a quarter is read from its own release
# wherever one exists.
# --------------------------------------------------------------------------
quarterly:
  - { year: 2019, quarter: "T1", accession: "0001171843-20-003098", document: "f6k_043020.htm", column: "prior",   label: "GAP 1Q20 results", filed: "2020-04-30" }
