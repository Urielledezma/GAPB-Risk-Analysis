<style>
  /* Submission stylesheet.
     Quarto emits the website grid markup even for a standalone render, and
     _quarto.yml sizes it at body 1100px + margin 320px + gutters (~1470px).
     Nothing here may cap the page width: an earlier `body { max-width: 1120px }`
     starved the body column down to ~750px, because the margin column is fixed
     and the deficit comes out of the prose. Style the ink, not the layout. */

  :root { --ink: #20252b; --muted: #65707c; --line: #dfe4e8; --accent: #1769aa; }
  body { color: var(--ink); background: #fff; line-height: 1.62; }
  main.content { padding-bottom: 4rem; }

  h1, h2, h3 { line-height: 1.18; }
  h2 { color: #173f5f; border-bottom: 1px solid var(--line); padding-bottom: .35rem; margin-top: 2.7rem; }
  h3 { color: #24557a; margin-top: 2rem; }
  a { color: var(--accent); }

  /* The table of contents sits in the 320px margin column: keep it single
     column and let it breathe. It is not a full-width block here. */
  #TOC { border-left: 3px solid var(--accent); padding-left: .9rem; }
  #TOC ul { columns: 1; }

  table { border-collapse: collapse; margin: 1.2rem 0 2rem; font-size: .92rem; }
  caption { text-align: left; font-weight: 600; color: #173f5f; margin-bottom: .45rem; }
  th { background: #edf3f7; text-align: left; }
  th, td { border-bottom: 1px solid var(--line); padding: .55rem .65rem; vertical-align: top; }

  img { max-width: 100%; height: auto; }
  figure { margin: 2rem 0; }
  figcaption { color: var(--muted); font-size: .9rem; }
  blockquote { color: var(--muted); border-left: 3px solid var(--line); padding-left: 1rem; }

  /* Printing is the one case where the margin column has nowhere to go. */
  @media print {
    #quarto-margin-sidebar, #TOC { display: none; }
    body { font-size: 10.5pt; }
    a { color: inherit; text-decoration: none; }
    h2, h3 { break-after: avoid; }
    figure, table { break-inside: avoid; }
  }
</style>
